

<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>Point Coffee Space</title>

<style>
body{margin:0;font-family:sans-serif;background:#faf8f4}
nav{display:flex;justify-content:space-between;padding:15px;background:white;border-bottom:1px solid #ddd}
.nav-links a{margin:0 10px;cursor:pointer}
.page{display:none;padding:20px}
.page.active{display:block}
.menu-item{display:flex;justify-content:space-between;margin:5px 0}
</style>

</head>

<body>

<nav>
  <div>POINT Coffee Space</div>
  <div class="nav-links">
    <a onclick="showPage('home')">หน้าแรก</a>
    <a onclick="showPage('about')">เกี่ยวกับร้าน</a>
    <a onclick="showPage('menu')">เมนู</a>
  </div>
</nav>

<div id="page-home" class="page active">
  <h1>Welcome to Point Coffee</h1>
</div>

<div id="page-about" class="page">
  <h2>เกี่ยวกับร้าน</h2>
  <p>ร้านกาแฟ Specialty</p>
</div>

<div id="page-menu" class="page">
  <h2>เมนู</h2>
  <button onclick="saveMenu()">💾 บันทึก</button>
  <div id="menu-display"></div>
</div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
import { getFirestore, doc, setDoc, getDoc } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";

const firebaseConfig = {
  apiKey: "AIzaSyDoYF1lZcMFMovJ8QGlfxR6lvPgb0Orf0",
  authDomain: "point-coffee-1329f.firebaseapp.com",
  projectId: "point-coffee-1329f",
};

const app = initializeApp(firebaseConfig);
const db = getFirestore(app);

// ===== DATA =====
let menuData = [
  {name:"Espresso",price:"55"},
  {name:"Americano",price:"60"}
];

// ===== NAV =====
function showPage(id){
  document.querySelectorAll('.page').forEach(p=>p.classList.remove('active'));
  document.getElementById('page-'+id).classList.add('active');
}

// ===== RENDER =====
function renderMenu(){
  const el=document.getElementById("menu-display");
  el.innerHTML = menuData.map((m)=>`
    <div class="menu-item">
      <div>${m.name}</div>
      <div>฿${m.price}</div>
    </div>
  `).join("");
}

// ===== FIREBASE =====
async function saveMenu(){
  await setDoc(doc(db,"menu","main"),{
    data:menuData
  });
  alert("บันทึกแล้ว!");
}

async function loadMenu(){
  const docRef = doc(db,"menu","main");
  const docSnap = await getDoc(docRef);

  if(docSnap.exists()){
    menuData = docSnap.data().data;
  }

  renderMenu();
}

// ===== GLOBAL =====
window.showPage = showPage;
window.saveMenu = saveMenu;

// ===== START =====
loadMenu();
</script>

</body>
</html>
