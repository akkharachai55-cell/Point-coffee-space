<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>Point Coffee Space</title>

<style>
body{
  margin:0;
  font-family: 'Segoe UI', sans-serif;
  background:#faf8f4;
  color:#2c2419;
}

/* NAV */
nav{
  display:flex;
  justify-content:space-between;
  padding:15px 30px;
  background:white;
  border-bottom:1px solid #ddd;
}

/* HERO */
.hero{
  text-align:center;
  padding:60px 20px;
}

.hero h1{
  font-size:36px;
}

/* MENU */
.menu{
  max-width:700px;
  margin:auto;
  padding:20px;
}

.menu-item{
  display:flex;
  justify-content:space-between;
  margin:8px 0;
}

input{
  width:45%;
  padding:6px;
}

button{
  margin:5px;
  padding:6px 12px;
  cursor:pointer;
}
</style>

</head>

<body>

<nav>
  <h2>POINT Coffee Space</h2>
</nav>

<div class="hero">
  <h1>Welcome to Point Coffee</h1>
  <p>Fresh coffee. Cozy space.</p>
</div>

<div class="menu">
  <button onclick="addItem()">เพิ่มเมนู</button>
  <button onclick="saveMenu()">💾 บันทึก</button>

  <div id="menu-display"></div>
</div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
import { getFirestore, doc, setDoc, getDoc } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";

const firebaseConfig = {
  apiKey: "AIzaSyDoYF1lZcMFMovJ8QGlfxR6lvPgb0Orf0",
  authDomain: "point-coffee-1329f.firebaseapp.com",
  projectId: "point-coffee-1329f",
};

const app = initializeApp(firebaseConfig);
const db = getFirestore(app);

// DATA
let menuData = [
  {name:"Espresso",price:"55"},
  {name:"Americano",price:"60"},
  {name:"Latte",price:"75"}
];

// UI
function renderMenu(){
  const el = document.getElementById("menu-display");
  el.innerHTML = menuData.map((m,i)=>`
    <div class="menu-item">
      <input value="${m.name}" onchange="updateName(${i},this.value)">
      <input value="${m.price}" onchange="updatePrice(${i},this.value)">
    </div>
  `).join("");
}

// ACTION
function addItem(){
  menuData.push({name:"เมนูใหม่",price:"0"});
  renderMenu();
}

function updateName(i,v){menuData[i].name=v;}
function updatePrice(i,v){menuData[i].price=v;}

// FIREBASE
async function saveMenu(){
  await setDoc(doc(db,"menu","main"),{
    data:menuData
  });
  alert("บันทึกแล้ว");
}

async function loadMenu(){
  const docRef = doc(db,"menu","main");
  const docSnap = await getDoc(docRef);

  if(docSnap.exists()){
    menuData = docSnap.data().data;
  }

  renderMenu();
}

loadMenu();

// FIX BUTTON
window.addItem = addItem;
window.saveMenu = saveMenu;
window.updateName = updateName;
window.updatePrice = updatePrice;

</script>

</body>
</html>
